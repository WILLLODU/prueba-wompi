<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba Wompi</title>
</head>
<body>

<button id="btnPagar">Pagar Póliza</button>

<script>
var PUBLIC_KEY    = "pub_prod_ZoIGbL2sKR0F5iOYhAjjw29hhNeHoCmt";
var INTEGRITY_KEY = "prod_integrity_GKWnljU2i4Kn1NQ8DFo0ksa3mm9xTicv";
var CURRENCY      = "COP";
var AMOUNT_CENTS  = 2344400;
var TIPO_POLIZA   = "SOAT";
var NUM_POLIZA    = "2022020";
var REFERENCE     = TIPO_POLIZA + NUM_POLIZA + Date.now();
var FULL_NAME     = "Carlos Ramirez";
var EMAIL         = "carlos.ramirez@correo.com";
var PHONE         = "3001234567";
var PHONE_PREFIX  = "+57";
var LEGAL_ID      = "123456789";
var LEGAL_ID_TYPE = "CC";

async function sha256(str) {
  var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
}

document.getElementById("btnPagar").addEventListener("click", async function() {
  var firma = await sha256(REFERENCE + AMOUNT_CENTS + CURRENCY + INTEGRITY_KEY);

  var anterior = document.getElementById("wompi-wrap");
  if (anterior) anterior.remove();

  var wrap = document.createElement("div");
  wrap.id = "wompi-wrap";
  document.body.appendChild(wrap);

  var script = document.createElement("script");
  script.src = "https://checkout.wompi.co/widget.js";
  script.setAttribute("data-public-key",          PUBLIC_KEY);
  script.setAttribute("data-currency",            CURRENCY);
  script.setAttribute("data-amount-in-cents",     String(AMOUNT_CENTS));
  script.setAttribute("data-reference",           REFERENCE);
  script.setAttribute("data-signature:integrity", firma);
  script.setAttribute("data-redirect-url",        window.location.href);
  script.setAttribute("data-customer-data:full-name",           FULL_NAME);
  script.setAttribute("data-customer-data:email",               EMAIL);
  script.setAttribute("data-customer-data:phone-number",        PHONE);
  script.setAttribute("data-customer-data:phone-number-prefix", PHONE_PREFIX);
  script.setAttribute("data-customer-data:legal-id",            LEGAL_ID);
  script.setAttribute("data-customer-data:legal-id-type",       LEGAL_ID_TYPE);
  script.setAttribute("data-render", "button");

  wrap.appendChild(script);

  setTimeout(function() {
    var btn = wrap.querySelector("button");
    if (btn) btn.click();
  }, 900);
});
</script>
</body>
</html>
